<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BirdBrain — Auction Simulator</title>

<style>
/* Brand v1.3 dark variant — see auction_dashboard_template.html for the
   full derivation note. Same tokens, deliberately: the simulator should feel
   like the room you will actually be in. */
:root{
  --ink:#ECEEF2; --graphite:#B4BAC4; --muted:#868D98;
  --border:#262A32; --surface:#0E1014; --white:#171A20; --raised:#1D2128;
  --slate:#DFE3EA; --slate-hover:#FFFFFF; --slate-mid:#7C8595;
  --slate-tint:#232830; --on-slate:#12141A;
  --accent:#8F6BFF; --accent-tint:#1E1730;
  --amber-t:#E3A94A; --amber-bg:#2A2114;
  --pos-t:#4FBFA0; --neg-t:#E07B7B;
  --r-lg:14px; --r-md:11px; --r-sm:8px; --r-pill:999px;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.38);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--surface);color:var(--ink);
  line-height:1.45;-webkit-font-smoothing:antialiased;font-size:13px;padding:16px 14px 40px}
.wrap{max-width:440px;margin:0 auto}
.slash{width:5px;height:17px;border-radius:99px;background:var(--accent);transform:rotate(18deg);flex:0 0 auto}
.mark{display:inline-grid;place-items:center}.mark svg{width:100%;height:100%}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:15px;box-shadow:var(--shadow);margin-bottom:13px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.head-l{display:flex;align-items:center;gap:11px}
.card-head h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--graphite)}
.count{font-size:11px;font-weight:700;color:var(--slate);background:var(--slate-tint);padding:2px 9px;border-radius:var(--r-pill)}
.btn{font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:var(--r-sm);
  cursor:pointer;border:1px solid transparent}
.btn-primary{background:var(--slate);color:var(--on-slate)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--border)}
.btn:disabled{opacity:.4;cursor:default}
input,select{font-family:inherit;font-size:13px;font-weight:500;padding:10px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--ink);width:100%}
header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px}
h1{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--accent)}
h1 span.t{color:var(--ink)}
.sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}
.stat{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 7px;text-align:center}
.stat .v{font-size:15px;font-weight:800;letter-spacing:-.02em}
.stat .k{font-size:9.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}

/* the block on the block */
.lot{background:linear-gradient(180deg,var(--accent-tint),var(--white));
  border:1px solid var(--border);border-radius:var(--r-lg);padding:15px;margin-bottom:13px}
.lot .who{font-size:20px;font-weight:800;letter-spacing:-.02em}
.lot .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.lot .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 11px}
.lot .n{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:8px;text-align:center}
.lot .n .v{font-size:15px;font-weight:800}
.lot .n .k{font-size:9.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.bidrow{display:flex;gap:7px;align-items:center}
.bidrow input{width:96px}
.hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45}
.hint b{color:var(--ink)}

.trow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)}
.trow:last-child{border-bottom:none}
.trow.me{background:linear-gradient(90deg,var(--accent-tint),transparent);border-radius:var(--r-sm);padding-left:8px}
.tname{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tneed{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}
.tmoney{text-align:right;flex:0 0 auto;font-size:13px;font-weight:800;letter-spacing:-.02em}
.tmoney small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0}
.log{font-size:11.5px;line-height:1.6;max-height:230px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px solid var(--border)}
.log .win{color:var(--pos-t);font-weight:700}
.log .lose{color:var(--muted)}
.empty{font-size:12px;color:var(--muted);padding:14px 0;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:var(--r-pill);cursor:pointer;
  background:var(--slate-tint);color:var(--muted)}
.chip.on{background:var(--slate);color:var(--on-slate)}
@media (min-width:820px){
  body{padding:22px 22px 30px}
  .wrap{max-width:1140px}
  .app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1><span class="t">Auction Simulator</span>

          <span class="count" id="c-room"></span>
        </div>
        <div id="room"></div>
      </div>
    </div>
  </div>
</div>

":false},{"id":"12482","name":"Savion Williams","pos":"WR","team":"GBP","tier":8,"bye":11,"value":0.0,"price":0.0,"surplus":0.0,"proj":42.4,"rostered":false},{"id":"12718","name":"Konata Mumpfield","pos":"WR","team":"LAR","tier":8,"bye":11,"value":0.0,"price":0.0,"surplus":0.0,"proj":42.0,"rostered":false},{"id":"9501","name":"Demario Douglas","pos":"WR","team":"NEP","tier":8,"bye":11,"value":0.0,"price":0.0,"surplus":0.0,"proj":41.8,"rostered":false},{"id":"7562","name":"Tutu Atwell","pos":"WR","team":"MIA","tier":8,"bye":6,"value":0.0,"price":0.0,"surplus":0.0,"proj":41.8,"rostered":false},{"id":"13405","name":"Kaytron Allen","pos":"RB","team":"WAS","tier":11,"bye":7,"value":0.0,"price":0.0,"surplus":0.0,"proj":41.6,"rostered":false},{"id":"12541","name":"Dont'e Thornton","pos":"WR","team":"LVR","tier":8,"bye":13,"value":0.0,"price":0.0,"surplus":0.0,"proj":41.5,"rostered":false},{"id":"13319","name":"Oscar Delp","pos":"TE","team":"NOS","tier":3,"bye":8,"value":0.0,"price":0.0,"surplus":0.0,"proj":41.4,"rostered":false},{"id":"7587","name":"Dyami Brown","pos":"WR","team":"WAS","tier":8,"bye":7,"value":0.0,"price":0.0,"surplus":0.0,"proj":41.1,"rostered":false},{"id":"13282","name":"Jack Endries","pos":"TE","team":"CIN","tier":3,"bye":6,"value":0.0,"price":0.0,"surplus":0.0,"proj":41.0,"rostered":false},{"id":"13278","name":"Max Klare","pos":"TE","team":"LAR","tier":3,"bye":11,"value":0.0,"price":0.0,"surplus":0.0,"proj":40.8,"rostered":false},{"id":"8135","name":"Treylon Burks","pos":"WR","team":"WAS","tier":8,"bye":7,"value":0.0,"price":0.0,"surplus":0.0,"proj":40.6,"rostered":false},{"id":"13288","name":"Nicholas Singleton","pos":"RB","team":"TEN","tier":11,"bye":9,"value":0.0,"price":1.7,"surplus":-1.7,"proj":40.5,"rostered":false},{"id":"11647","name":"Kimani Vidal","pos":"RB","team":"LAC","tier":11,"bye":7,"value":0.0,"price":1.0,"surplus":-1.0,"proj":40.3,"rostered":false},{"id":"3271","name":"Tyler Higbee","pos":"TE","team":"LAR","tier":3,"bye":11,"value":0.0,"price":0.0,"surplus":0.0,"proj":40.1,"rostered":false},{"id":"7670","name":"Joshua Palmer","pos":"WR","team":"BUF","tier":8,"bye":7,"value":0.0,"price":0.0,"surplus":0.0,"proj":39.7,"rostered":false},{"id":"13420","name":"Bryce Lance","pos":"WR","team":"NOS","tier":8,"bye":8,"value":0.0,"price":0.0,"surplus":0.0,"proj":39.6,"rostered":false},{"id":"13338","name":"Kevin Coleman","pos":"WR","team":"MIA","tier":8,"bye":6,"value":0.0,"price":0.0,"surplus":0.0,"proj":39.5,"rostered":false},{"id":"7694","name":"Tommy Tremble","pos":"TE","team":"CAR","tier":3,"bye":5,"value":0.0,"price":0.0,"surplus":0.0,"proj":39.5,"rostered":false},{"id":"13307","name":"Marlin Klein","pos":"TE","team":"HOU","tier":3,"bye":8,"value":0.0,"price":0.0,"surplus":0.0,"proj":39.5,"rostered":false},{"id":"13411","name":"Zavion Thomas","pos":"WR","team":"CHI","tier":8,"bye":10,"value":0.0,"price":0.0,"surplus":0.0,"proj":39.3,"rostered":false},{"id":"13270","name":"CJ Daniels","pos":"WR","team":"LAR","tier":8,"bye":null,"value":0.0,"price":0.0,"surplus":0.0,"proj":39.3,"rostered":false},{"id":"13421","name":"Eli Raridon","pos":"TE","team":"NEP","tier":3,"bye":11,"value":0.0,"price":0.0,"surplus":0.0,"proj":39.0,"rostered":false}],"plan":[{"slot":"QB1","budget":48,"note":"QB4-QB10 \u2014 anchor the mandatory slot"},{"slot":"QB2","budget":15,"note":"QB28-30 cliff; bye insurance, upgrade later via FAAB"},{"slot":"RB1","budget":30,"note":"tier 1-2"},{"slot":"RB2","budget":16,"note":""},{"slot":"WR1","budget":30,"note":"tier 1"},{"slot":"WR2","budget":18,"note":""},{"slot":"WR3/FLEX","budget":14,"note":""},{"slot":"TE","budget":12,"note":"TE is only ~6-7% of board value; do not overpay"},{"slot":"Bench x5","budget":17,"note":"$1-6 each; eliminated rosters refill the pool weekly"}]};
const LG = P.league, DATA = P.players, ROSTERS = P.rosters;
const MIN_ROSTER = {QB:2, RB:4, WR:5, TE:1};
const MY = LG.my_roster_id;
const BOARD = {}; DATA.forEach(p => BOARD[p.name] = p);
const byId = id => document.getElementById(id);
const money = v => '$' + (Math.round(v*10)/10).toFixed(v < 10 ? 1 : 0);

/* ---------------------------------------------------------------------
   BOT MODEL. Each opponent gets a persistent personality (aggression) plus
   fresh per-player noise, so the room is neither a mirror of our board nor
   pure randomness. Bots value from EXPECTED PRICE, not from our valuation —
   that is the whole point: the room prices the market, and our edge is only
   real if it survives bidding against people who do not share our numbers.

   Clearing uses SECOND PRICE + $1, which is how an English auction actually
   ends: the winner pays one dollar more than the last person still bidding,
   not their own maximum. Simulating first-price would make every win feel
   ruinous and teach the wrong lesson about what to bid.
   --------------------------------------------------------------------- */
let MODE = 'normal';
const MODES = {normal:[0.88,1.12], hot:[1.05,1.35], cold:[0.72,0.95]};

let S, bots, order, log, lot, seed;
function rnd(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; }

function init(){
  seed = 20260830;
  S = {sold:{}, passed:{}, nomIdx:0};
  const [lo,hi] = MODES[MODE];
  bots = {};
  ROSTERS.forEach(r => {
    if (r.roster_id === MY) return;
    bots[r.roster_id] = {agg: lo + rnd()*(hi-lo)};
  });
  order = ROSTERS.map(r => r.roster_id);
  log = [];
  nextLot();
}

const recsOf = rid => Object.values(S.sold).filter(s => s.roster === rid);
const spentOf = rid => recsOf(rid).reduce((a,s) => a + s.price, 0);
const leftOf = rid => LG.budget - spentOf(rid);
const slotsOf = rid => LG.roster_size - recsOf(rid).length;
const maxOf = rid => Math.max(1, leftOf(rid) - (slotsOf(rid) - 1));
function needsOf(rid){
  const have = {}; recsOf(rid).forEach(s => have[s.pos] = (have[s.pos]||0)+1);
  const n = {}; for (const k in MIN_ROSTER) n[k] = Math.max(0, MIN_ROSTER[k]-(have[k]||0));
  return n;
}
function inflation(){
  let paid = 0; Object.values(S.sold).forEach(s => paid += s.price);
  let left = 0; DATA.forEach(p => { if (p.rostered && !S.sold[p.name]) left += p.value; });
  return left > 0 ? (LG.teams*LG.budget - paid) / left : 1;
}
const undrafted = () => DATA.filter(p => !S.sold[p.name] && !S.passed[p.name]);

function botBid(rid, p){
  const b = bots[rid];
  if (!b) return 0;
  // A full roster must never bid. Without this the max-bid formula
  // left - (slots-1) turns INTO A BONUS once slots goes negative, so an
  // over-full team could outbid everyone and spend past its budget.
  if (slotsOf(rid) <= 0) return 0;
  const cap = maxOf(rid);
  if (cap <= 1) return 0;
  const need = needsOf(rid);
  const totalNeed = Object.values(need).reduce((a,c) => a+c, 0);
  // must reserve dollars for slots they are still obliged to fill
  if (totalNeed >= slotsOf(rid) && !need[p.pos]) return 0;
  let v = (p.price || p.value) * b.agg * (0.85 + rnd()*0.3);
  if (need[p.pos]) v *= 1.12;
  if (slotsOf(rid) <= 3 && !need[p.pos]) v *= 0.5;
  return Math.min(Math.round(v), cap);
}

function nextLot(){
  const pool = undrafted().filter(p => p.rostered);
  if (!pool.length || slotsOf(MY) <= 0){ lot = null; render(); return; }
  const nominator = order[S.nomIdx % order.length];
  let pick;
  if (nominator === MY){
    // your nomination turn — offered the best remaining surplus
    pick = pool.slice().sort((a,b) => b.surplus - a.surplus)[0];
  } else {
    // bots nominate near the top, with some scatter
    const top = pool.slice().sort((a,b) => b.price - a.price).slice(0, 14);
    pick = top[Math.floor(rnd()*top.length)];
  }
  lot = {p: pick, nominator: nominator};
  render();
}

function resolve(myBid){
  const p = lot.p;
  const bids = [];
  ROSTERS.forEach(r => {
    if (r.roster_id === MY) return;
    const b = botBid(r.roster_id, p);
    if (b > 1) bids.push({rid: r.roster_id, bid: b});
  });
  if (myBid > 1 && slotsOf(MY) > 0) bids.push({rid: MY, bid: myBid});
  if (!bids.length){
    // Nobody wants him at any price. He goes for $1 to a team that has both
    // a slot and a dollar — never to a full one, which is what previously
    // let rosters run past their size and budgets go negative.
    const able = order.filter(r => slotsOf(r) > 0 && leftOf(r) >= 1);
    if (!able.length){ S.passed[p.name] = true; S.nomIdx++; nextLot(); return; }
    bids.push({rid: able[S.nomIdx % able.length], bid: 1});
  }
  bids.sort((a,b) => b.bid - a.bid);
  const win = bids[0];
  const second = bids[1] ? bids[1].bid : 1;
  const price = Math.max(1, Math.min(win.bid, second + 1));

  S.sold[p.name] = {name: p.name, pos: p.pos, price: price, roster: win.rid};
  const tname = (ROSTERS.find(r => r.roster_id === win.rid) || {}).name;
  const mine = win.rid === MY;
  log.unshift({mine: mine, text: p.name + ' (' + p.pos + ') → ' + tname
    + ' ' + money(price) + ' · our ' + money(p.value) + ' · mkt ' + money(p.price)
    + (myBid > 1 && !mine ? ' · you bid ' + money(myBid) : '')});
  S.nomIdx++;
  nextLot();
}

function render(){
  byId('subline').textContent = LG.name + ' · ' + LG.teams + 'tm superflex · $'
    + LG.budget + ' auction · simulated room';
  byId('s-budget').textContent = money(leftOf(MY));
  byId('s-slots').textContent = slotsOf(MY);
  byId('s-max').textContent = money(maxOf(MY));
  byId('s-infl').textContent = inflation().toFixed(2) + '×';

  if (!lot){
    byId('lot').innerHTML = '<div class="who">Draft complete</div>'
      + '<div class="meta">Roster full — hit Reset to run it again.</div>';
  } else {
    const p = lot.p;
    const nomName = (ROSTERS.find(r => r.roster_id === lot.nominator) || {}).name;
    const rec = Math.min(p.value * inflation(), maxOf(MY));
    const n = needsOf(MY);
    byId('lot').innerHTML =
      '<div class="who">' + p.name + '</div>'
      + '<div class="meta">' + p.pos + ' · ' + p.team + ' · tier ' + (p.tier||'-')
      + (p.bye ? ' · bye ' + p.bye : '') + ' — nominated by '
      + (lot.nominator === MY ? '<b>you</b>' : nomName) + '</div>'
      + '<div class="nums">'
      + '<div class="n"><div class="v">' + money(p.value) + '</div><div class="k">Our value</div></div>'
      + '<div class="n"><div class="v">' + money(p.price) + '</div><div class="k">Market</div></div>'
      + '<div class="n"><div class="v">' + money(rec) + '</div><div class="k">Your max</div></div>'
      + '</div>'
      + (slotsOf(MY) <= 0 ? '<div class="hint"><b>Your roster is full</b> — pass to watch the rest.</div>' : '')
      + '<div class="bidrow"><input type="number" inputmode="decimal" id="mybid" placeholder="$" '
      + 'value="' + Math.round(rec) + '">'
      + '<button class="btn btn-primary" id="bid">Bid</button>'
      + '<button class="btn btn-ghost" id="pass">Pass</button></div>'
      + '<div class="hint">Need ' + (Object.keys(n).filter(k=>n[k]>0).map(k=>k+n[k]).join(' ') || 'nothing')
      + ' · winner pays <b>second price + $1</b>, so bidding your true max is safe.</div>';
    byId('bid').onclick = () => resolve(parseFloat(byId('mybid').value) || 0);
    byId('pass').onclick = () => resolve(0);
  }

  const mine = recsOf(MY).sort((a,b) => b.price - a.price);
  byId('c-mine').textContent = mine.length;
  byId('mine').innerHTML = mine.length ? mine.map(s => {
    const p = BOARD[s.name] || {};
    const d = s.price - (p.value || 0);
    return '<div class="trow"><div style="flex:1;min-width:0">'
      + '<div class="tname">' + s.name + '</div>'
      + '<div class="tneed">' + s.pos + ' · our value ' + money(p.value || 0)
      + ' · <span style="color:' + (d <= 0 ? 'var(--pos-t)' : 'var(--neg-t)') + '">'
      + (d <= 0 ? 'saved ' : 'over ') + money(Math.abs(d)) + '</span></div></div>'
      + '<div class="tmoney">' + money(s.price) + '</div></div>';
  }).join('') : '<div class="empty">Nothing won yet</div>';

  byId('c-room').textContent = Object.keys(S.sold).length + ' sold';
  byId('room').innerHTML = ROSTERS.map(r => {
    const nd = needsOf(r.roster_id);
    const need = Object.keys(nd).filter(k=>nd[k]>0).map(k=>k+nd[k]).join(' ') || 'full';
    return '<div class="trow' + (r.roster_id===MY?' me':'') + '">'
      + '<div style="flex:1;min-width:0"><div class="tname">' + r.name
      + (r.roster_id===MY?' ★':'') + '</div>'
      + '<div class="tneed">' + slotsOf(r.roster_id) + ' slots · ' + need + '</div></div>'
      + '<div class="tmoney">' + money(leftOf(r.roster_id))
      + '<small>max ' + money(maxOf(r.roster_id)) + '</small></div></div>';
  }).join('');

  byId('c-log').textContent = log.length + ' lots';
  byId('log').innerHTML = log.length
    ? log.slice(0, 60).map(l => '<div class="' + (l.mine?'win':'lose') + '">'
        + (l.mine ? '★ ' : '') + l.text + '</div>').join('')
    : '<div class="empty">No lots yet</div>';
}

byId('reset').onclick = init;
byId('modes').onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  MODE = c.dataset.m;
  document.querySelectorAll('#modes .chip').forEach(x => x.classList.toggle('on', x===c));
  init();
};
init();
</script>
